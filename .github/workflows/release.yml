name: Release

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check release version
        run: node -e 'const m=require("./manifest.json"); if(process.env.GITHUB_REF_NAME !== m.version) throw new Error("Tag must match manifest version");'
      - run: pnpm run check
      - run: pnpm run package
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          zip -r note-quiz-engine.zip note-quiz-engine
          cd ..
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" main.js manifest.json styles.css dist/note-quiz-engine.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css dist/note-quiz-engine.zip --verify-tag --title "Note Quiz Engine $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
